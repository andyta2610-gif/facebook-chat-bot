name = "facebook-chat-bot"
main = "src/index.js"
compatibility_date = "2026-11-01"
keep_vars = true   # giữ các biến anh nhập trên Cloudflare, không bị xoá khi cập nhật mã

[vars]
CLAUDE_MODEL = "claude-sonnet-5-5"
HANDOFF_HOURS = "12"
# Bot chờ khách ngừng nhắn bao nhiêu giây rồi mới trả lời gộp (tối đa MAX_WAIT_SECONDS)
DEBOUNCE_SECONDS = "8"
MAX_WAIT_SECONDS = "30"
# APP_ID: ID của app Meta (dạng số), dùng để phân biệt tin bot gửi với tin nhân viên gửi
APP_ID = "2697118804024412"

# Mỗi khách một "Conversation" (Durable Object): lịch sử, hàng chờ tin, chuyển người thật
[[durable_objects.bindings]]
name = "CONVO"
class_name = "Conversation"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Conversation"]

[[kv_namespaces]]
binding = "BOT_KV"
id = "4643ee4e6ad54cc594443bfbbf809720"   # lấy từ lệnh: npx wrangler kv namespace create BOT_KV

# Các khoá bí mật KHÔNG ghi ở đây, nhập bằng lệnh `npx wrangler secret put ...`:
#   ANTHROPIC_API_KEY, PAGE_ACCESS_TOKEN, APP_SECRET, VERIFY_TOKEN
#   (tuỳ chọn) TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

[observability]
enabled = true
